[package]
name = "browserroute"
version = "0.1.0"
description = "Local-first smart URL routing"
edition = "2021"

[lib]
name = "browserroute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "browserroute"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
